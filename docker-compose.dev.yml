version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: audira_dev_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: audira_user
      POSTGRES_PASSWORD: audira_secure_password
      POSTGRES_DB: audira_netops
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./database/schema/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audira_user -d audira_netops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audira_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass audira_redis_password
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "audira_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: audira_dev_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-models:/root/.ollama
