version: '3.8'

networks:
  audira_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  ollama_data:

services:
  nginx:
    image: nginx:alpine
    container_name: audira_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - audira_internal

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: audira_frontend
    restart: always
    environment:
      - VITE_API_URL=/api/v1
      - VITE_WS_URL=/ws
    networks:
      - audira_internal

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audira_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-audira_user}:${DB_PASSWORD:-audira_secure_password}@postgres:5432/${DB_NAME:-audira_netops}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-audira_redis_password}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audira_internal

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: audira_worker
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-audira_user}:${DB_PASSWORD:-audira_secure_password}@postgres:5432/${DB_NAME:-audira_netops}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-audira_redis_password}@redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audira_internal

  postgres:
    image: postgres:16-alpine
    container_name: audira_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-audira_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audira_secure_password}
      POSTGRES_DB: ${DB_NAME:-audira_netops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-audira_user} -d ${DB_NAME:-audira_netops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - audira_internal

  redis:
    image: redis:7-alpine
    container_name: audira_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-audira_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-audira_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - audira_internal

  ollama:
    image: ollama/ollama:latest
    container_name: audira_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - audira_internal
